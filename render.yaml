services:
  - type: web
    name: pac-2026-ineter
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    disk:
      name: pac-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
